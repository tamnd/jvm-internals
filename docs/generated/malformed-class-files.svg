  <line x1="40.0" y1="488.0" x2="960.0" y2="488.0" stroke="#868e96" stroke-width="1.0"/>
  <text x="40.0" y="512.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="12" fill="#212529" font-weight="normal" text-anchor="start">With the verifier off, five of the six load. The one with a bad pool index sometimes runs and sometimes kills the VM.</text>
  <text x="40.0" y="534.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#868e96" font-weight="normal" text-anchor="start">linux-x64, osx-arm64, win-x64, java 27+35-2325, measured 2026-09-02</text>
