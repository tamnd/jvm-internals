  <text x="280.0" y="310.0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#212529" font-weight="normal" text-anchor="end">final and abstract</text>
  <line x1="300.0" y1="306.0" x2="369.0" y2="306.0" stroke="#212529" stroke-width="1.6"/>
