<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-label="Where each deliberately malformed class file stops">
  <rect width="1000" height="560" fill="#ffffff"/>
  <text x="40.0" y="42.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="22" fill="#212529" font-weight="600" text-anchor="start">Where a broken class file stops</text>
  <text x="40.0" y="66.0" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#868e96" font-weight="normal" text-anchor="start">Six malformations, and how far into a running program each one gets.</text>
