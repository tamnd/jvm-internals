# Links are checked on every pull request. A dead link in this project is a
# broken promise rather than a cosmetic problem, because the whole pitch is that
# a reader can go and check.

exclude_path = [".git", "build", "site"]

exclude = [
  # openjdk.org returns 403 to anything that is not a browser, so a checker
  # cannot tell a moved page from a bot block and the result is noise.
  "^https://openjdk\\.org",
  # The advisory form 404s for anyone without write access, including the
  # checker, so a working link and a broken one look the same from here.
  "^https://github\\.com/tamnd/jvm-internals/security/advisories/new",
]

max_retries = 3
timeout = 20
accept = [200, 206, 429]
