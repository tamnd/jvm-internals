name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Nothing in this workflow writes anything. Set at the top so a job that gets
# added later has to ask for a permission out loud rather than inheriting one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The prose rules from CONTRIBUTING.md that a machine can check. Standard
  # library Python and no install step, because a lint that takes ninety seconds
  # to set up is a lint people stop running locally.
  prose:
    name: prose rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python tools/prosecheck.py .

  # The notebook is build output, so the only thing keeping it honest is a job that
  # rebuilds it and compares. Without this, a hand edited notebook and a lesson
  # source say different things and the reader gets whichever one they opened.
  notebooks:
    name: notebooks match their source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: unit tests
        run: |
          python tools/test_build.py
          python tools/test_gen_diagram.py
          python tools/test_hprof_count.py
          python tools/test_gen_noise_chart.py
          python tools/test_gen_capability_matrix.py
          python tools/test_gen_malformed_table.py
          python tools/test_gen_widget_matrix.py
          python tools/test_gen_sa_types.py
          python tools/test_gen_hsdis.py
          python tools/test_gen_section2.py
          python tools/test_refcheck.py
          python tools/test_gen_jvms_index.py
          python tools/test_fetch_jdk.py
      - name: rebuild and compare
        run: python tools/build.py check
      # The diagram is drawn from the committed layout file and touches no
      # network, so it belongs in the offline job rather than next to the
      # generator that fetches markWord.hpp.
      - name: the diagrams match the committed layout
        run: python tools/gen_diagram.py --check
      # Same idea for the probe chart, which is drawn from a committed results
      # file. A picture that has drifted from its measurements is worse than no
      # picture, because nobody rereads a chart they have already believed.
      - name: the noise chart matches the measured results
        run: python tools/gen_noise_chart.py --check
      # The capability matrix is a table nobody will regenerate before reading,
      # so the only thing keeping it true is this.
      - name: the capability matrix matches the measured results
        run: python tools/gen_capability_matrix.py --check
      # The malformed class file table and its picture come from the same three
      # results files, so they can disagree with each other as well as with the
      # measurements. Regenerating both from one command is what stops that.
      - name: the malformed class file table matches the measured results
        run: python tools/gen_malformed_table.py --check
      # The widget grid decides how every widget in the project gets built, so a
      # stale one sends somebody off to write a style tag that will be thrown away.
      - name: the widget delivery grid matches the measured results
        run: python tools/gen_widget_matrix.py --check
      # The type database page is half permission matrix and half struct layouts,
      # and both halves are things somebody will quote without rerunning the probe
      # that takes ten minutes and a spare 300MB.
      - name: the type database page matches the measured results
        run: python tools/gen_sa_types.py --check
      # The hsdis page carries a licence table, which is the one kind of generated
      # table somebody might act on outside this repository, so it gets the same
      # treatment as the rest and a stale one fails the build.
      - name: the hsdis page matches the measured results
        run: python tools/gen_hsdis.py --check
      # Section 2 of the object header blueprint, which is the first generated
      # blueprint section and the one a reader will quote a memory offset out of.
      # It folds into the bpc job when bpc exists, and until then it is checked
      # here for the same reason as everything else above it.
      - name: the object header section 2 matches the measured results
        run: python tools/gen_section2.py --check
      - name: three builds are byte identical
        run: |
          set -euo pipefail
          # An empty notebooks/ is a real state: it is what the repository looks
          # like before the first lesson lands. Three passes over nothing is a
          # pass, so the hashing has to tolerate the directory not existing yet
          # rather than take set -e down with it.
          hashes() {
            if [ -d notebooks ]; then
              find notebooks -name '*.ipynb' | LC_ALL=C sort | xargs -r shasum -a 256
            fi
          }
          for pass in 1 2 3; do
            python tools/build.py notebooks > /dev/null
            hashes > "/tmp/pass${pass}"
          done
          diff /tmp/pass1 /tmp/pass2
          diff /tmp/pass2 /tmp/pass3
          echo "three builds, $(wc -l < /tmp/pass1) notebooks, same bytes"

  # A grader is the one piece of a lesson a reader argues with, so it gets tested
  # against the JDK the lesson was written on and not against whatever the runner
  # image happens to ship. Half of O01's tests measure a real object, and until
  # this job existed they skipped in CI, which is the same as not having them.
  graders:
    name: lesson graders on the pinned JDK
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Keyed on the pin file, so moving the pin misses the cache and downloads
      # the new build, which is the behaviour you want from a cache that holds
      # the thing every number in the repository is measured against.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jvx
          key: jdk-${{ runner.os }}-${{ hashFiles('docs/pin.json') }}
      # Not setup-java, on purpose. This is the same script a contributor runs on
      # their own machine, it takes the URL and the SHA256 out of docs/pin.json,
      # and it refuses to unpack anything whose hash does not match. Running it
      # here means the path that puts a JDK on a machine is exercised on every
      # push rather than only when somebody sets up a new box.
      - name: install the pinned JDK
        run: echo "JAVA_HOME=$(python tools/fetch_jdk.py)" >> "$GITHUB_ENV"
      - name: which java this is
        run: '"$JAVA_HOME/bin/java" -version'
      # A skip is not a pass. The whole point of this job is that the measuring
      # tests actually measure, so a skip here fails the job rather than letting
      # it go green with half the suite quietly switched off.
      - name: lesson grader tests, and no skips
        run: |
          set -euo pipefail
          for test in lessons/*/test_*.py; do
            # An unmatched glob comes back as itself, so check before running it.
            [ -e "$test" ] || continue
            echo "== $test"
            python "$test" 2>&1 | tee /tmp/graders.log
            if grep -q "skipped=" /tmp/graders.log; then
              echo "$test skipped a test with the pinned JDK installed"
              exit 1
            fi
          done
      # This one is here rather than in the offline job because half of it loads
      # the whole helper surface into a real jshell and reads the markup back out.
      # Checking that against the source instead would be checking the wrong thing,
      # and the bug that started it was invisible in the source.
      - name: the helper surface loads, and draws what it says it draws
        run: |
          set -euo pipefail
          python tools/test_jvx_ui.py 2>&1 | tee /tmp/ui.log
          if grep -q "skipped=" /tmp/ui.log; then
            echo "the markup tests skipped with the pinned JDK installed"
            exit 1
          fi

  # Numbers that came out of HotSpot's own headers have to keep coming out of
  # them, and lines this repository points at have to keep saying what they said.
  # This is a separate job from the notebooks one on purpose: it is the only
  # thing in CI that reaches out to openjdk/jdk, so when GitHub's raw host has a
  # bad minute the failure says "the check could not reach upstream" instead of
  # quietly discrediting the determinism check next door.
  generated:
    name: generated files and citations match HotSpot
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      # Keyed on the pin, because what is cached is source files at an immutable
      # tag. A tag never moves, so a hit is always correct, and moving the pin is
      # exactly when the cache should be thrown away and every citation refetched.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/jvx/src
          key: jdk-src-${{ runner.os }}-${{ hashFiles('docs/pin.json') }}
      - name: unit tests
        run: python tools/test_gen_markword.py
      - name: the mark word layout is still what is committed
        run: python tools/gen_markword.py --check
      # The section index for the pinned specification edition. Oracle republishes
      # a page in place, so a chapter whose hash moved is an event worth stopping
      # for: a section that was renumbered changes what every claim citing it says.
      - name: the specification section index is still what is committed
        run: python tools/gen_jvms_index.py --check
      # Every path:line@tag in the repository, resolved against the tree at the tag
      # it names, with the cited line and two either side hashed into
      # docs/citations.json. A line number that drifts is obvious to a reader. A
      # line number that still exists and now says something else is not, and this
      # is the only thing that catches it. Every JVMS section reference goes
      # through the index in the same pass.
      - name: every citation still says what it said
        run: python tools/refcheck.py --report

  # Workflow files get the same treatment as everything else here. actionlint
  # catches the shell and expression mistakes, zizmor catches the security ones,
  # and the reason both run is that a workflow is the part of a repository
  # nobody reviews carefully and the part that holds a token.
  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # From the checksums file in the upstream release. The tarball is
          # verified before anything in it is executed, because a download that
          # nobody checks is not pinned, it is merely versioned. Dependabot does
          # not watch this one, so the version and the hash move together by
          # hand and the hash is what makes that safe.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "$tarball" actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Findings are the point of running this, so a finding fails the run
          # rather than filing a code scanning alert nobody opens.
          advanced-security: false
          persona: pedantic

  # Every link in the repository, resolved. This project's entire pitch is that
  # a reader can go and check, so a dead link is a broken promise rather than a
  # cosmetic problem.
  links:
    name: every link resolves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --cache --max-cache-age 1d --accept 200,206,429 .
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The jobs below do not exist yet and are listed here rather than in a
  # planning document so that whoever adds one can see where it goes. The number
  # after each is its wall clock budget. A job that exceeds its budget by half
  # is a bug filed against the job rather than a tolerated slowdown.
  #
  #   Every push
  #     lint          2m   ruff, black, spotless, markdown, YAML front matter
  #     structure     3m   the rest of build.py check: no GPL header outside
  #                        patches/ and vendor/, glossary uniqueness. The
  #                        directives, the caps and the requires DAG are already
  #                        in the notebooks job above
  #     markers       1m   rule 7: every claim carries [JVMS] or [HOTSPOT], and
  #                        at most two unobservable claims per lesson. refcheck
  #                        resolves both kinds already, in the generated job
  #                        above. What is left for this one is the claim ledger:
  #                        that every claim has a marker at all, and that a
  #                        [JVMS] marker's section says what the claim says
  #     bpc           6m   bpc build then bpc check, so no generated blueprint
  #                        section is stale and no coverage item is unowned. Two
  #                        pieces of it already run above and fold into this one
  #                        when bpc exists: the mark word layout in the generated
  #                        job, and the object header's section 2 in the notebooks
  #                        job
  #     e0-fast      25m   the tier 0 cells of changed lessons, in the Colab
  #                        parity image. Expensive, and the one that must not be
  #                        cut, because a lesson whose observations quietly
  #                        stopped being true is worse than no lesson
  #
  #   Nightly
  #     e0-full      90m   every tier 0 cell of every lesson, cold
  #     colab-image  40m   rebuild the Colab parity image and time the bootstrap
  #     jdk-build    60m   release, fastdebug and slowdebug from the pin
  #     e1          120m   every tier 1 cell, and re record every replay
  #     matrix       45m   the workloads under all fifteen configurations
  #
  #   Weekly
  #     jcstress      6h   on the self hosted runner, because a shared two core
  #                        cloud runner does not merely make the outcome
  #                        distributions noisy, it makes them wrong
  #     jtreg         4h   the selected subsets, to keep the classification
  #                        file honest
  #     capstone      5h   all three tracks, and the scorecard regenerated
  #     driftbot     30m   diff openjdk/jdk master against the pin, file issues
  #
  #   On change
  #     anim         50m   re render animations, assert byte identical output
  #                        for unchanged scenes
  #     site         12m   pre execute, convert, build, deploy with mike
  #
  # A dependency review job and a dependabot ecosystem for Gradle, Maven, pip
  # and cargo arrive with the first manifest, which is M0.
  #
  # They arrive with M0 and M2. See ROADMAP.md.
