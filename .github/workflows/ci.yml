name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Nothing in this workflow writes anything. Set at the top so a job that gets
# added later has to ask for a permission out loud rather than inheriting one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The prose rules from CONTRIBUTING.md that a machine can check. Standard
  # library Python and no install step, because a lint that takes ninety seconds
  # to set up is a lint people stop running locally.
  prose:
    name: prose rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - run: python tools/prosecheck.py .

  # The notebook is build output, so the only thing keeping it honest is a job that
  # rebuilds it and compares. Without this, a hand edited notebook and a lesson
  # source say different things and the reader gets whichever one they opened.
  notebooks:
    name: notebooks match their source
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: unit tests
        run: |
          python tools/test_build.py
          python tools/test_gen_diagram.py
          python tools/test_hprof_count.py
          python tools/test_gen_noise_chart.py
      # Graders are per lesson. The runner has a JDK on PATH but not the pinned
      # one, so the tests that measure a real object skip here and the ones that
      # read source still run. A grader is the one piece of a lesson a reader
      # argues with, so the parts that can be checked without the pinned JDK are
      # worth checking on every push. Setting up JDK 27 here is #11.
      - name: lesson grader tests
        run: |
          for test in lessons/*/test_*.py; do
            # An unmatched glob comes back as itself, so check before running it.
            [ -e "$test" ] || continue
            echo "== $test"
            python "$test"
          done
      - name: rebuild and compare
        run: python tools/build.py check
      # The diagram is drawn from the committed layout file and touches no
      # network, so it belongs in the offline job rather than next to the
      # generator that fetches markWord.hpp.
      - name: the diagrams match the committed layout
        run: python tools/gen_diagram.py --check
      # Same idea for the probe chart, which is drawn from a committed results
      # file. A picture that has drifted from its measurements is worse than no
      # picture, because nobody rereads a chart they have already believed.
      - name: the noise chart matches the measured results
        run: python tools/gen_noise_chart.py --check
      - name: three builds are byte identical
        run: |
          set -euo pipefail
          # An empty notebooks/ is a real state: it is what the repository looks
          # like before the first lesson lands. Three passes over nothing is a
          # pass, so the hashing has to tolerate the directory not existing yet
          # rather than take set -e down with it.
          hashes() {
            if [ -d notebooks ]; then
              find notebooks -name '*.ipynb' | LC_ALL=C sort | xargs -r shasum -a 256
            fi
          }
          for pass in 1 2 3; do
            python tools/build.py notebooks > /dev/null
            hashes > "/tmp/pass${pass}"
          done
          diff /tmp/pass1 /tmp/pass2
          diff /tmp/pass2 /tmp/pass3
          echo "three builds, $(wc -l < /tmp/pass1) notebooks, same bytes"

  # Numbers that came out of HotSpot's own headers have to keep coming out of
  # them. This is a separate job from the notebooks one on purpose: it is the
  # only thing in CI that reaches out to openjdk/jdk, so when GitHub's raw host
  # has a bad minute the failure says "the generated file check could not reach
  # upstream" instead of quietly discrediting the determinism check next door.
  generated:
    name: generated files match HotSpot
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: unit tests
        run: python tools/test_gen_markword.py
      - name: the mark word layout is still what is committed
        run: python tools/gen_markword.py --check

  # Workflow files get the same treatment as everything else here. actionlint
  # catches the shell and expression mistakes, zizmor catches the security ones,
  # and the reason both run is that a workflow is the part of a repository
  # nobody reviews carefully and the part that holds a token.
  workflows:
    name: actionlint and zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          # From the checksums file in the upstream release. The tarball is
          # verified before anything in it is executed, because a download that
          # nobody checks is not pinned, it is merely versioned. Dependabot does
          # not watch this one, so the version and the hash move together by
          # hand and the hash is what makes that safe.
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict -
          tar -xzf "$tarball" actionlint
          ./actionlint -color
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # Findings are the point of running this, so a finding fails the run
          # rather than filing a code scanning alert nobody opens.
          advanced-security: false
          persona: pedantic

  # Every link in the repository, resolved. This project's entire pitch is that
  # a reader can go and check, so a dead link is a broken promise rather than a
  # cosmetic problem.
  links:
    name: every link resolves
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --cache --max-cache-age 1d --accept 200,206,429 .
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The jobs below do not exist yet and are listed here rather than in a
  # planning document so that whoever adds one can see where it goes. The number
  # after each is its wall clock budget. A job that exceeds its budget by half
  # is a bug filed against the job rather than a tolerated slowdown.
  #
  #   Every push
  #     lint          2m   ruff, black, spotless, markdown, YAML front matter
  #     structure     3m   the rest of build.py check: no GPL header outside
  #                        patches/ and vendor/, glossary uniqueness. The
  #                        directives, the caps and the requires DAG are already
  #                        in the notebooks job above
  #     refcheck      4m   every path:line@tag against the pinned tree's hashes,
  #                        every JVMS section reference against the section index
  #     markers       1m   rule 7: every claim carries [JVMS] or [HOTSPOT], and
  #                        at most two unobservable claims per lesson
  #     bpc           6m   bpc build then bpc check, so no generated blueprint
  #                        section is stale and no coverage item is unowned. The
  #                        first generator, the mark word layout, is already in
  #                        the generated job above and folds into this one when
  #                        bpc exists
  #     e0-fast      25m   the tier 0 cells of changed lessons, in the Colab
  #                        parity image. Expensive, and the one that must not be
  #                        cut, because a lesson whose observations quietly
  #                        stopped being true is worse than no lesson
  #
  #   Nightly
  #     e0-full      90m   every tier 0 cell of every lesson, cold
  #     colab-image  40m   rebuild the Colab parity image and time the bootstrap
  #     jdk-build    60m   release, fastdebug and slowdebug from the pin
  #     e1          120m   every tier 1 cell, and re record every replay
  #     matrix       45m   the workloads under all fifteen configurations
  #
  #   Weekly
  #     jcstress      6h   on the self hosted runner, because a shared two core
  #                        cloud runner does not merely make the outcome
  #                        distributions noisy, it makes them wrong
  #     jtreg         4h   the selected subsets, to keep the classification
  #                        file honest
  #     capstone      5h   all three tracks, and the scorecard regenerated
  #     driftbot     30m   diff openjdk/jdk master against the pin, file issues
  #
  #   On change
  #     anim         50m   re render animations, assert byte identical output
  #                        for unchanged scenes
  #     site         12m   pre execute, convert, build, deploy with mike
  #
  # A dependency review job and a dependabot ecosystem for Gradle, Maven, pip
  # and cargo arrive with the first manifest, which is M0.
  #
  # They arrive with M0 and M2. See ROADMAP.md.
