name: scorecard

# This repository will eventually ask readers to run code it publishes: a
# bootstrap cell that installs a kernel, a jar from Maven Central, a JVMTI agent
# as a shared library, and a container image. That is a supply chain, and a
# project whose whole pitch is "you can check everything" does not get to make
# an exception for its own release process.
#
# OpenSSF Scorecard grades the parts of that a machine can grade: pinned
# dependencies, token permissions, branch protection, dangerous workflow
# patterns, and whether anything here is published without provenance. The score
# is public on the badge, which is the point, because a private score is a score
# nobody acts on.

on:
  branch_protection_rule:
  schedule:
    - cron: "30 5 * * 1"
  push:
    branches: [main]

# Scorecard needs a handful of read scopes and two write ones, and it asks for
# them per job below rather than inheriting a blanket read-all here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write # to upload the result to the code scanning tab, where a finding sits next to the line that caused it
      id-token: write # to publish the result to the public OpenSSF API, which is what the badge reads
      contents: read # to read the workflows, the branch rules and the pinned actions
      actions: read # to read the workflow run history the dangerous-workflow audit needs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
